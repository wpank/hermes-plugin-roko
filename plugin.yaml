name: roko
version: 0.6.0
description: >-
  roko for Hermes: delegate gated, budget-capped work to a roko harness. Hermes
  writes and runs roko plans, follows runs to a verified verdict, recalls what
  roko learned, and answers what a run waits on, with the person approving
  anything that spends money or acts on the world.
author: "Will Pankiewicz"
license: "MIT OR Apache-2.0"
homepage: https://github.com/wpank/roko
# Explicit: without it, Hermes may classify a plugin as a memory provider.
kind: standalone
# Hermes' own interpreter runs this plugin, and its one dependency, httpx, ships with every Hermes (the
# OpenAI SDK needs it). `external` tells Hermes to prepare no Python environment for the plugin. Without it,
# Hermes treats pyproject.toml as dependencies to install: `hermes plugins install --enable` asks a
# default-No question and, without a terminal, leaves the plugin disabled. pyproject.toml keeps httpx for
# a pip install and for the plugin's own tests.
python_runtime: external
# No requires_env: the key is optional (roko may run with auth off), and
# `hermes roko setup` mints and stores one. A missing key degrades the
# plugin's tools to clear errors; it never stops the plugin loading.
provides_tools:
  - roko_status
  - roko_plans
  - roko_run
  - roko_plan_generate
  - roko_plan_run
  - roko_cancel
  - roko_recall
  - roko_decide
# The desktop's three turn hooks (cards.py), registered where Hermes gates hooks per call (0.22+).
# The learning guard's pre_tool_call hook (learning_guard.py) is opt-in (learning_guard: true), and
# Hermes' plugins doctor and validate compare this list with a default registration, which adds only
# the turn hooks; registering the guard at runtime needs no declaration.
provides_hooks:
  - transform_llm_output
  - on_interim_message
  - on_session_end
config_schema:
  url:
    type: str
    default: "http://127.0.0.1:6677"
    description: "roko serve base URL. The ROKO_URL environment variable overrides it."
  workdir:
    type: str
    description: >-
      Path to the roko workspace roko serve runs in. Lets the plugin find the
      server's URL and launch token in <workdir>/.roko/runtime/.
  api_key_env:
    type: str
    default: "ROKO_API_KEY"
    description: "Name of the environment variable holding the roko API key."
  max_run_usd:
    type: float
    default: 5.0
    description: "Largest max_usd a run started from Hermes may name."
  max_day_usd:
    type: float
    default: 20.0
    description: >-
      Most that runs started from Hermes may spend in one day, all together
      (spent plus what running runs may still spend). 0 turns the limit off.
  approve_paid:
    type: bool
    default: true
    description: "Ask the person before a tool starts paid roko work."
  confirm_decisions:
    type: bool
    default: true
    description: "Ask the person before roko_decide records an answer for them."
  prompt_section:
    type: bool
    default: true
    description: "Teach the model roko's delegation protocol in the system prompt."
  allow_insecure_remote:
    type: bool
    default: false
    description: "Allow sending the API key over plain http to a non-loopback host."
  timeout_s:
    type: float
    default: 20.0
    description: "Seconds to wait for roko serve to answer one request."
  ui_actions:
    type: bool
    default: true
    description: >-
      Let the desktop app and web dashboard start plan runs, answer what runs
      wait on and cancel runs. Off makes them read-only.
  learning_guard:
    type: bool
    default: false
    description: >-
      Opt-in: refuse Hermes' background review a skill or memory that teaches
      repairing roko's state or re-running paid roko work (Hermes 0.22+; takes
      effect when Hermes restarts). Off by default because while any plugin
      hook is registered, Hermes can refuse concurrent tool calls that carry no
      call id.
